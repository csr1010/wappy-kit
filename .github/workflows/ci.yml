name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      # Full history + tags: the gate diffs old tests/fixtures against the previous m<n>-done tag (B2).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bump this number as each milestone lands (gate is cumulative). --allow-test-change is
      # required again here: render.m4.test.ts was corrected post-m7-done (Meta rejects an empty
      # interactive.body.text; see SPEC.md v2.6), so B2's diff against m7-done flags it on every
      # run until the gate number moves past 8 (M9's own m8-done baseline will include the fix).
      - run: pnpm gate 8 --allow-test-change "SPEC v2.6 - Meta rejects empty interactive.body.text, render.m4.test.ts corrected accordingly"
