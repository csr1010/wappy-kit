name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      # Full history + tags: the gate diffs old tests/fixtures against the previous m<n>-done tag (B2).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bump this number as each milestone lands (gate is cumulative).
      - run: pnpm gate 6 --allow-test-change "M6 T6.2/T6.8/T6.9: composeWithBudget folds recentTurns into the flat assembled prompt string instead of passing history separately to model.generate(); two agent.m5.test.ts tests were updated to inspect req.prompt instead of req.history for the same underlying claim (see docs/PROGRESS.md Decision & change log, 2026-09-21)."
